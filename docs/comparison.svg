<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="2195" viewBox="0 0 1560 2195" font-family="Segoe UI, -apple-system, Roboto, Helvetica, Arial, sans-serif">
<rect width="1560" height="2195" fill="#0a0c10"/>
<rect x="24" y="24" width="1512" height="2147" rx="14" fill="#161b22"/>
<text x="54" y="82" font-size="30" font-weight="700" fill="#e6edf3">nasjidwg compared with the other open DWG/DXF libraries</text>
<text x="54" y="110" font-size="14" fill="#9198a1">Facts checked against each project's own source and documentation. Names are used to identify the projects; no affiliation is implied.</text>
<text x="54" y="148" font-size="18" font-weight="700" fill="#58a6ff">Rotated layouts now survive: VIEWTWIST and the header UCS are read, written and exported</text>
<text x="1506" y="148" text-anchor="end" font-size="13" fill="#9198a1">2026-08-17 16:30 EDT   ·   655 passing · gate exit 0 · pack clean</text>
<text x="62" y="186" font-size="14" fill="#3fb950">✓  R12 · R13 · R14 · R2000 · R2004 · R2007 · R2018</text>
<text x="484" y="186" font-size="14" fill="#3fb950">all OPEN + AUDIT 0 errors in AutoCAD 2027 (gated)</text>
<text x="62" y="210" font-size="14" fill="#3fb950">✓  Saved view: VIEWTWIST + VPORT record</text>
<text x="484" y="210" font-size="14" fill="#3fb950">36 of 36 fields agree with AutoCAD DXFOUT on nine drawings across R14/R2000/R2007/R2018 — the twist was never decoded before and the walk drifted</text>
<text x="484" y="228" font-size="14" fill="#3fb950">one BD from there on</text>
<text x="62" y="252" font-size="14" fill="#3fb950">✓  Header UCS</text>
<text x="484" y="252" font-size="14" fill="#3fb950">UCSORG/UCSXDIR/UCSYDIR were read and thrown away; captured now, written back, and carried through DXF as $UCSORG/$UCSXDIR/$UCSYDIR</text>
<text x="62" y="276" font-size="14" fill="#3fb950">✓  R2007: empty CLASSES payload</text>
<text x="484" y="276" font-size="14" fill="#3fb950">AC1021 refuses it exactly as AC1032 does — the stub record now goes out from R2007 on</text>
<text x="62" y="300" font-size="14" fill="#3fb950">✓  R2007: inline ACIS framing</text>
<text x="484" y="300" font-size="14" fill="#3fb950">the payload starts on the BIT after its version field, then a flag and the cached wireframe block — measured on genuine records, both hidden by a</text>
<text x="484" y="318" font-size="14" fill="#3fb950">reader that probes for the magic</text>
<text x="62" y="342" font-size="14" fill="#3fb950">✓  R2007: kernel dialect</text>
<text x="484" y="342" font-size="14" fill="#3fb950">AC1021 reads only the pre-ASM binary form inline; an ASM stream now leaves as SAT or is reported</text>
<text x="62" y="366" font-size="14" fill="#3fb950">✓  random_seed at record 0x100</text>
<text x="484" y="366" font-size="14" fill="#3fb950">retired as a blocker: five drawings saved from five separate AutoCAD launches carry the identical value — it is a per-process RNG draw, not a</text>
<text x="484" y="384" font-size="14" fill="#3fb950">function of the file</text>
<text x="62" y="408" font-size="14" fill="#3fb950">✓  Page slack is a generated stream</text>
<text x="484" y="408" font-size="14" fill="#3fb950">one MT19937 init array per file feeds every slack region and the seven envelope fields; its content is free (zeroed + re-parity'd audits clean)</text>
<text x="62" y="432" font-size="14" fill="#3fb950">✓  Provenance: AcDs section</text>
<text x="484" y="432" font-size="14" fill="#3fb950">4429 lifted bytes replaced by a hand-written emitter — still AUDIT 0/0, no thumbnail bytes</text>
<text x="62" y="456" font-size="14" fill="#3fb950">✓  Provenance: header keystream run</text>
<text x="484" y="456" font-size="14" fill="#3fb950">20 copied bytes now generated from the LCG (stream index = file offset)</text>
<text x="62" y="480" font-size="14" fill="#3fb950">✓  Provenance: 3DSOLID bit tail</text>
<text x="484" y="480" font-size="14" fill="#3fb950">decoded field by field (the GUID was a plain UUIDv4) — 163 bits, all computed, AUDIT 0/0</text>
<text x="62" y="504" font-size="14" fill="#3fb950">✓  Byte-preserving rewrite</text>
<text x="484" y="504" font-size="14" fill="#3fb950">verbatimRecords shipped</text>
<text x="62" y="528" font-size="14" fill="#3fb950">✓  Reader: 317 real files</text>
<text x="484" y="528" font-size="14" fill="#3fb950">zero throws, CRCs on</text>
<text x="62" y="552" font-size="14" fill="#8b949e">•  R2007 ACAD_TABLE record</text>
<text x="484" y="552" font-size="14" fill="#8b949e">the one entity AC1021 output cannot carry: the inline grid every other pre-R2010 container takes is refused there, with cell text and without it</text>
<text x="484" y="570" font-size="14" fill="#8b949e">— reported in skipped, never dropped silently</text>
<text x="62" y="594" font-size="14" fill="#3fb950">✓  Licence + provenance audit</text>
<text x="484" y="594" font-size="14" fill="#3fb950">no third-party file or code in the tree (hash-verified); PROVENANCE.md + NOTICE state the method</text>
<text x="62" y="618" font-size="14" fill="#3fb950">✓  R2007 Reed-Solomon parity</text>
<text x="484" y="618" font-size="14" fill="#3fb950">rsEncode used one generator for both codes — fixed, now byte-exact on 102 headers + 1231 pages + 55189 blocks</text>
<text x="62" y="642" font-size="14" fill="#3fb950">✓  Whole-file recompression</text>
<text x="484" y="642" font-size="14" fill="#3fb950">genuine files fully recompressed and re-encoded by us: AUDIT 0 errors (180 KB file, 2600 objects)</text>
<text x="62" y="668" font-size="13" fill="#9198a1">A real drawing found the next defect: an AC1014 site plan laid out at 45 degrees drew turned, because the whole rotation lives in</text>
<text x="62" y="687" font-size="13" fill="#9198a1">two fields the library dropped. VIEWTWIST was never decoded at all — and because the walk skipped it, every field after it drifted</text>
<text x="62" y="706" font-size="13" fill="#9198a1">one BD, which is why snapBase and gridSpacing used to come back as 6e-294 and 1e-314, and why the view direction and target came</text>
<text x="62" y="725" font-size="13" fill="#9198a1">back swapped. The header UCS was read and discarded outright. Worst of the three, the DXF writer then put a hard zero in group 51:</text>
<text x="62" y="744" font-size="13" fill="#9198a1">not missing data a consumer could handle, but a confident "this drawing is not rotated". The record layout was pinned bit for bit</text>
<text x="62" y="763" font-size="13" fill="#9198a1">with AutoCAD DXFOUT as the oracle, and now grades 36 of 36 fields on nine drawings.</text>
<text x="62" y="784" font-size="13" fill="#e6edf3">+ VIEWTWIST, the viewport UCS and the whole VPORT record read, written and round-tripped — graded 36/36 against AutoCAD</text>
<text x="62" y="805" font-size="13" fill="#e6edf3">+ Header UCS captured instead of discarded, and written back by every DWG writer and the DXF writer</text>
<text x="62" y="826" font-size="13" fill="#e6edf3">+ viewTwistTransform and ucsTransform: the transform that squares a rotated drawing, measured rather than assumed</text>
<line x1="54" y1="844" x2="1506" y2="844" stroke="#30363d"/>
