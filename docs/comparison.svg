<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1936" viewBox="0 0 1560 1936" font-family="Segoe UI, -apple-system, Roboto, Helvetica, Arial, sans-serif">
<rect width="1560" height="1936" fill="#0a0c10"/>
<rect x="24" y="24" width="1512" height="1888" rx="14" fill="#161b22"/>
<text x="54" y="82" font-size="30" font-weight="700" fill="#e6edf3">nasjidwg compared with the other open DWG/DXF libraries</text>
<text x="54" y="110" font-size="14" fill="#9198a1">Facts checked against each project's own source and documentation. Names are used to identify the projects; no affiliation is implied.</text>
<text x="54" y="148" font-size="18" font-weight="700" fill="#58a6ff">Real shipped bug found: every R2007 data page carried invalid RS parity</text>
<text x="1506" y="148" text-anchor="end" font-size="13" fill="#9198a1">2026-08-17 12:59 EDT   ·   623 passing · gate exit 0 · pack clean</text>
<text x="62" y="186" font-size="14" fill="#3fb950">✓  R12 · R13 · R14 · R2000 · R2004 · R2018</text>
<text x="484" y="186" font-size="14" fill="#3fb950">all OPEN + AUDIT 0 errors in AutoCAD 2027 (gated)</text>
<text x="62" y="210" font-size="14" fill="#3fb950">✓  Provenance: AcDs section</text>
<text x="484" y="210" font-size="14" fill="#3fb950">4429 lifted bytes replaced by a hand-written emitter — still AUDIT 0/0, no thumbnail bytes</text>
<text x="62" y="234" font-size="14" fill="#3fb950">✓  Provenance: header keystream run</text>
<text x="484" y="234" font-size="14" fill="#3fb950">20 copied bytes now generated from the LCG (stream index = file offset)</text>
<text x="62" y="258" font-size="14" fill="#3fb950">✓  Provenance: 3DSOLID bit tail</text>
<text x="484" y="258" font-size="14" fill="#3fb950">decoded field by field (the GUID was a plain UUIDv4) — 163 bits, all computed, AUDIT 0/0</text>
<text x="62" y="282" font-size="14" fill="#3fb950">✓  Byte-preserving rewrite</text>
<text x="484" y="282" font-size="14" fill="#3fb950">verbatimRecords shipped</text>
<text x="62" y="306" font-size="14" fill="#3fb950">✓  Reader: 317 real files</text>
<text x="484" y="306" font-size="14" fill="#3fb950">zero throws, CRCs on</text>
<text x="62" y="330" font-size="14" fill="#8b949e">•  R2007 write</text>
<text x="484" y="330" font-size="14" fill="#8b949e">blocker confirmed, not artefact: the same 64-bit value is free at 0xF8 and refused at 0x100, at identical compressed length</text>
<text x="62" y="354" font-size="14" fill="#3fb950">✓  Licence + provenance audit</text>
<text x="484" y="354" font-size="14" fill="#3fb950">no third-party file or code in the tree (hash-verified); PROVENANCE.md + NOTICE state the method</text>
<text x="62" y="378" font-size="14" fill="#3fb950">✓  R2007 Reed-Solomon parity</text>
<text x="484" y="378" font-size="14" fill="#3fb950">rsEncode used one generator for both codes — fixed, now byte-exact on 102 headers + 1231 pages + 55189 blocks</text>
<text x="62" y="402" font-size="14" fill="#3fb950">✓  Whole-file recompression</text>
<text x="484" y="402" font-size="14" fill="#3fb950">genuine files fully recompressed and re-encoded by us: AUDIT 0 errors (180 KB file, 2600 objects)</text>
<text x="62" y="428" font-size="13" fill="#9198a1">A second real blocker surfaced in SHIPPED code, not in a probe: R2007 uses two different Reed-Solomon codes — RS(255,239) for the</text>
<text x="62" y="447" font-size="13" fill="#9198a1">header and system pages, RS(255,251) for data pages — over two DIFFERENT fields, and our encoder used the header generator for</text>
<text x="62" y="466" font-size="13" fill="#9198a1">both, writing twelve parity bytes off the end of the array. Our own reader ignores parity, so it round-tripped perfectly and</text>
<text x="62" y="485" font-size="13" fill="#9198a1">nothing caught it. Both generators are now derived rather than transcribed, and whole genuine files recompressed end to end by us</text>
<text x="62" y="504" font-size="13" fill="#9198a1">audit clean in AutoCAD.</text>
<text x="62" y="525" font-size="13" fill="#e6edf3">+ RS parity bug fixed: derived both generators from first principles, verified byte-exact on 55189 blocks</text>
<text x="62" y="546" font-size="13" fill="#e6edf3">+ Comparison table audited for truth — our own R2007 write claim was false and is corrected</text>
<text x="62" y="567" font-size="13" fill="#e6edf3">+ Provenance clean and documented; six gated releases at AUDIT 0/0</text>
