<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="2148" viewBox="0 0 1560 2148" font-family="Segoe UI, -apple-system, Roboto, Helvetica, Arial, sans-serif">
<rect width="1560" height="2148" fill="#0a0c10"/>
<rect x="24" y="24" width="1512" height="2100" rx="14" fill="#161b22"/>
<text x="54" y="82" font-size="30" font-weight="700" fill="#e6edf3">nasjidwg compared with the other open DWG/DXF libraries</text>
<text x="54" y="110" font-size="14" fill="#9198a1">Facts checked against each project's own source and documentation. Names are used to identify the projects; no affiliation is implied.</text>
<text x="54" y="148" font-size="18" font-weight="700" fill="#58a6ff">R2007 write solved: all seven writable releases now open in AutoCAD at AUDIT 0</text>
<text x="1506" y="148" text-anchor="end" font-size="13" fill="#9198a1">2026-08-17 15:20 EDT   ·   646 passing · gate exit 0 · pack clean</text>
<text x="62" y="186" font-size="14" fill="#3fb950">✓  R12 · R13 · R14 · R2000 · R2004 · R2007 · R2018</text>
<text x="484" y="186" font-size="14" fill="#3fb950">all OPEN + AUDIT 0 errors in AutoCAD 2027 (gated)</text>
<text x="62" y="210" font-size="14" fill="#3fb950">✓  R2007: empty CLASSES payload</text>
<text x="484" y="210" font-size="14" fill="#3fb950">AC1021 refuses it exactly as AC1032 does — the stub record now goes out from R2007 on</text>
<text x="62" y="234" font-size="14" fill="#3fb950">✓  R2007: inline ACIS framing</text>
<text x="484" y="234" font-size="14" fill="#3fb950">the payload starts on the BIT after its version field, then a flag and the cached wireframe block — measured on genuine records, both hidden by a</text>
<text x="484" y="252" font-size="14" fill="#3fb950">reader that probes for the magic</text>
<text x="62" y="276" font-size="14" fill="#3fb950">✓  R2007: kernel dialect</text>
<text x="484" y="276" font-size="14" fill="#3fb950">AC1021 reads only the pre-ASM binary form inline; an ASM stream now leaves as SAT or is reported</text>
<text x="62" y="300" font-size="14" fill="#3fb950">✓  random_seed at record 0x100</text>
<text x="484" y="300" font-size="14" fill="#3fb950">retired as a blocker: five drawings saved from five separate AutoCAD launches carry the identical value — it is a per-process RNG draw, not a</text>
<text x="484" y="318" font-size="14" fill="#3fb950">function of the file</text>
<text x="62" y="342" font-size="14" fill="#3fb950">✓  Page slack is a generated stream</text>
<text x="484" y="342" font-size="14" fill="#3fb950">one MT19937 init array per file feeds every slack region and the seven envelope fields; its content is free (zeroed + re-parity'd audits clean)</text>
<text x="62" y="366" font-size="14" fill="#3fb950">✓  Provenance: AcDs section</text>
<text x="484" y="366" font-size="14" fill="#3fb950">4429 lifted bytes replaced by a hand-written emitter — still AUDIT 0/0, no thumbnail bytes</text>
<text x="62" y="390" font-size="14" fill="#3fb950">✓  Provenance: header keystream run</text>
<text x="484" y="390" font-size="14" fill="#3fb950">20 copied bytes now generated from the LCG (stream index = file offset)</text>
<text x="62" y="414" font-size="14" fill="#3fb950">✓  Provenance: 3DSOLID bit tail</text>
<text x="484" y="414" font-size="14" fill="#3fb950">decoded field by field (the GUID was a plain UUIDv4) — 163 bits, all computed, AUDIT 0/0</text>
<text x="62" y="438" font-size="14" fill="#3fb950">✓  Byte-preserving rewrite</text>
<text x="484" y="438" font-size="14" fill="#3fb950">verbatimRecords shipped</text>
<text x="62" y="462" font-size="14" fill="#3fb950">✓  Reader: 317 real files</text>
<text x="484" y="462" font-size="14" fill="#3fb950">zero throws, CRCs on</text>
<text x="62" y="486" font-size="14" fill="#8b949e">•  R2007 ACAD_TABLE record</text>
<text x="484" y="486" font-size="14" fill="#8b949e">the one entity AC1021 output cannot carry: the inline grid every other pre-R2010 container takes is refused there, with cell text and without it</text>
<text x="484" y="504" font-size="14" fill="#8b949e">— reported in skipped, never dropped silently</text>
<text x="62" y="528" font-size="14" fill="#3fb950">✓  Licence + provenance audit</text>
<text x="484" y="528" font-size="14" fill="#3fb950">no third-party file or code in the tree (hash-verified); PROVENANCE.md + NOTICE state the method</text>
<text x="62" y="552" font-size="14" fill="#3fb950">✓  R2007 Reed-Solomon parity</text>
<text x="484" y="552" font-size="14" fill="#3fb950">rsEncode used one generator for both codes — fixed, now byte-exact on 102 headers + 1231 pages + 55189 blocks</text>
<text x="62" y="576" font-size="14" fill="#3fb950">✓  Whole-file recompression</text>
<text x="484" y="576" font-size="14" fill="#3fb950">genuine files fully recompressed and re-encoded by us: AUDIT 0 errors (180 KB file, 2600 objects)</text>
<text x="62" y="602" font-size="13" fill="#9198a1">R2007 was never blocked by the header field four campaigns had pinned on. Making AutoCAD mint the evidence settled it: five</text>
<text x="62" y="621" font-size="13" fill="#9198a1">different drawings saved to R2007 from five separate accoreconsole launches carry the IDENTICAL random_seed, prologue key,</text>
<text x="62" y="640" font-size="13" fill="#9198a1">check-data word and crc_seed_encoded — one draw of a per-process RNG, carrying no information about the file, and zero is</text>
<text x="62" y="659" font-size="13" fill="#9198a1">accepted. The real defects were three, all in shipped code and all invisible to a self round trip: an empty CLASSES payload</text>
<text x="62" y="678" font-size="13" fill="#9198a1">(refused at AC1021 exactly as at AC1032), an inline ACIS payload written a bit-alignment off, and the cached wireframe block that</text>
<text x="62" y="697" font-size="13" fill="#9198a1">has to follow it. The one entity still short is ACAD_TABLE, which the writer now reports instead of emitting a drawing AutoCAD</text>
<text x="62" y="716" font-size="13" fill="#9198a1">refuses whole.</text>
<text x="62" y="737" font-size="13" fill="#e6edf3">+ R2007 write solved and gated — the seventh release now opens at AUDIT 0 errors with the full corpus</text>
<text x="62" y="758" font-size="13" fill="#e6edf3">+ random_seed retired as a blocker by an experiment, not an argument: same value from five separate AutoCAD launches</text>
<text x="62" y="779" font-size="13" fill="#e6edf3">+ Page slack identified as one MT19937 init array per file, and proven free — an earlier ledger called it uninitialised memory</text>
